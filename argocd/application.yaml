apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: git@github.com:harel2320-dev/sample-nodejs.git
      targetRevision: main
      path: helm/sample-nodejs
      helm:
        valueFiles:
          - $values/sample-nodejs/values.yaml
    - repoURL: git@github.com:harel2320-dev/sample-nodejs-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-nodejs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
