name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config auto --severity=ERROR --error .

  build-and-scan:
    name: Build image & Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t sample-nodejs:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sample-nodejs:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          scanners: vuln

  push:
    name: Push to registry
    needs: [sast, build-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Deferred: AWS/ECR push needs an OIDC trust + IAM role, not yet
      # provisioned (no AWS infra exists yet). See DECISIONS.md.
      - run: echo "AWS/ECR push deferred - OIDC trust not yet provisioned."
