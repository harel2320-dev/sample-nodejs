name: DAST (OWASP ZAP baseline)

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, not continuous - DAST is a monitoring signal, not a gate,
    # and frequent scanning would generate real traffic against the live app.
    - cron: '0 3 * * 1'

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Each public route scanned directly, not via spider - responses
      # are plain text with no links between routes for ZAP to follow.
      # allow_issue_writing is off (Issues disabled on this repo);
      # fail_action + the uploaded report artifact are the real alert.
      - name: Scan /my-app
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://sample-nodejs.catsweather.online/my-app'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap_scan_my-app'

      - name: Scan /about
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://sample-nodejs.catsweather.online/about'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap_scan_about'
