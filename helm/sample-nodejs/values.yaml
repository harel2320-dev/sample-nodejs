replicaCount: 2

image:
  repository: ""   # set at deploy time: private registry (ECR) repo URL
  tag: ""           # set at deploy time: image tag/digest from the CI build
  pullPolicy: IfNotPresent

namespace: sample-nodejs

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  className: alb
  host: ""          # set per environment
  certificateArn: "" # ACM cert ARN, set once TLS is wired up (deferred)
  paths:
    - path: /my-app
      pathType: Prefix
    - path: /about
      pathType: Prefix

config:
  port: "8080"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
